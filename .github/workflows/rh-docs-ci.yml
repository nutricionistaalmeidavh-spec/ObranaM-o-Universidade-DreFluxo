name: RH Docs CI

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/rh-docs-ci.yml'

jobs:
  desktop-rh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test -- electron/services/admission-documents.test.ts
      - run: npm run build
