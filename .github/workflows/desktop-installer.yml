name: Desktop Windows Installer

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-installer.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-installer.yml'

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Desktop
        run: npm run test:desktop
      - name: Build Desktop
        run: npm run build:desktop
      - name: Generate NSIS installer
        run: npm --workspace apps/desktop run dist
      - name: Resolve Desktop version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Fluxo-DRE-Desktop-${{ env.DESKTOP_VERSION }}-Windows
          path: apps/desktop/release/Fluxo-DRE-Setup-${{ env.DESKTOP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-v$env:DESKTOP_VERSION"
          $asset = "apps/desktop/release/Fluxo-DRE-Setup-$env:DESKTOP_VERSION.exe"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Fluxo DRE Desktop v$env:DESKTOP_VERSION" --notes "Instalador Windows do Desktop MH validado pelo CI."
          } else {
            gh release upload $tag $asset --repo "${{ github.repository }}" --clobber
          }
