name: Desktop Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-installer.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-installer.yml'

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Desktop
        run: npm run test:desktop
      - name: Build Desktop
        run: npm run build:desktop
      - name: Generate NSIS installer
        run: npm --workspace apps/desktop run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Fluxo-DRE-Desktop-1.1.6-Windows
          path: apps/desktop/release/Fluxo-DRE-Setup-1.1.6.exe
          if-no-files-found: error
          retention-days: 30
